[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "actuarial_stochastic_model"
version = "0.1.0"
description = "Stochastic actuarial modeling framework"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "streamlit>=1.24.0",
    "plotly>=5.15.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.8.2"
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["actuarial_stochastic_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=actuarial_stochastic_model"
