[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "actuarial_stochastic_model"
version = "0.1.0"
description = "Stochastic actuarial modeling framework"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "scipy>=1.9.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.11.0",
    "streamlit>=1.24.0",
    "plotly>=5.15.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.9",
    "reportlab>=4.0.0",
    "requests>=2.28.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.3.0",
    "flake8>=4.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["actuarial_stochastic_model"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-v"
